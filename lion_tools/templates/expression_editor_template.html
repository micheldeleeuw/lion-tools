<style>
    .ee-overlay {
        --ee-text: var(--dt-text, #2c3e50);
        --ee-muted: var(--dt-muted, #657487);
        --ee-border: var(--dt-border, #dce2e8);
        --ee-surface: var(--dt-surface, #f6f8fa);
        --ee-accent: var(--dt-accent, #5f7ea8);
        --ee-hover: var(--dt-hover, #eef2f9);
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(30, 41, 59, 0.45);
        z-index: 1600;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
    }
    .ee-overlay.show { display: flex; }
    .ee-dialog {
        display: flex;
        flex-direction: column;
        width: min(860px, calc(100vw - 24px));
        height: min(560px, calc(100vh - 24px));
        max-height: calc(100vh - 24px);
        background: white;
        border-radius: 8px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        font-size: 12px;
        color: var(--ee-text);
        outline: none;
    }
    .ee-header { display: flex; flex: none; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--ee-border); }
    .ee-title { min-width: 0; overflow-wrap: anywhere; font-size: 14px; font-weight: bold; }
    .ee-close { flex: none; width: 28px; height: 28px; border: none; border-radius: 4px; background: none; font-size: 20px; line-height: 1; color: var(--ee-muted); cursor: pointer; }
    .ee-close:hover { color: var(--ee-text); background: var(--ee-hover); }
    .ee-body { display: flex; flex-direction: column; flex: 1; gap: 16px; min-height: 0; overflow: auto; padding: 16px; }
    .ee-label { display: block; flex: none; margin: 0; font-weight: bold; }
    .ee-name-field { display: flex; flex: none; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--ee-border); }
    .ee-name-field input { flex: 1; min-width: 0; }
    .ee-workspace { display: grid; flex: 1; min-height: 260px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
    .ee-main, .ee-columns { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
    .ee-overlay input[type="text"] {
        width: 100%;
        height: 28px;
        padding: 0 8px;
        border: 1px solid var(--ee-border);
        border-radius: 4px;
        font-size: 12px;
        box-sizing: border-box;
    }
    .ee-expression {
        flex: 1 0 auto;
        width: 100%;
        height: 220px;
        min-height: 180px;
        padding: 12px;
        border: 1px solid var(--ee-border);
        border-radius: 4px;
        box-sizing: border-box;
        font-family: Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.6;
        resize: vertical;
    }
    .ee-overlay input[type="text"]:focus, .ee-expression:focus {
        outline: none;
        border-color: var(--ee-accent);
        box-shadow: 0 0 0 2px rgba(95, 126, 168, 0.25);
    }
    .ee-list { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; border: 1px solid var(--ee-border); border-radius: 4px; }
    .ee-search-row { position: sticky; top: 0; z-index: 2; box-sizing: border-box; height: 37px; padding: 4px 6px; background: white; border-bottom: 1px solid var(--ee-border); }
    .ee-list-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 37px; z-index: 1; padding: 6px 8px; background: var(--ee-surface); color: var(--ee-muted); border-bottom: 1px solid var(--ee-border); font-size: 11px; }
    .ee-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, auto);
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 28px;
        padding: 6px 8px;
        border: none;
        border-bottom: 1px solid #f0f2f5;
        background: none;
        font-size: 12px;
        color: inherit;
        text-align: left;
        cursor: pointer;
    }
    .ee-item:hover { background: var(--ee-hover); }
    .ee-item:focus-visible { outline: none; box-shadow: inset 0 0 0 2px rgba(95, 126, 168, 0.35); }
    .ee-item .ee-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ee-item .ee-type { max-width: 100px; overflow: hidden; text-overflow: ellipsis; color: var(--ee-muted); white-space: nowrap; text-align: right; }
    .ee-empty { padding: 12px; color: var(--ee-muted); }
    .ee-footer { display: flex; flex: none; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--ee-border); }
    .ee-footer .primary { margin-left: auto; }
    .ee-error { flex: none; max-height: 72px; overflow: auto; overflow-wrap: anywhere; padding: 8px 16px; color: #a63327; background: #fff8e6; border-top: 1px solid #f0d9a0; }
    .ee-error:empty { display: none; }
    .ee-btn {
        height: 28px;
        padding: 0 14px;
        background: white;
        color: var(--ee-text);
        border: 1px solid var(--ee-border);
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
    }
    .ee-btn:hover { background: var(--ee-hover); }
    .ee-btn.primary { background: var(--ee-accent); border-color: var(--ee-accent); color: white; }
    .ee-btn.primary:hover { background: #4f6d95; }
    .ee-btn.quiet { background: none; border-color: transparent; color: var(--ee-muted); }
    .ee-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .ee-btn:focus-visible, .ee-close:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(95, 126, 168, 0.35); }
    @media (max-width: 760px) {
        .ee-header, .ee-footer { padding: 10px 12px; }
        .ee-body { padding: 12px; }
        .ee-workspace { flex: none; grid-template-columns: 1fr; }
        .ee-expression { flex: none; height: clamp(150px, 28vh, 220px); min-height: 150px; }
        .ee-list { flex: none; height: clamp(120px, 28vh, 200px); }
    }
</style>
<script>
// Reusable SQL expression editor: type an expression, name it, click columns to insert them.
window.LionExpressionEditor = (function() {
    var overlay = null, dialog, titleEl, nameInput, textarea, search, listEl, errorBox, cancelBtn, submitBtn, closeBtn;
    var opts = null;
    var lastFocus = null;

    function quoteIdent(name) {
        return '`' + String(name).replace(/`/g, '``') + '`';
    }

    function build() {
        overlay = $('<div class="ee-overlay"></div>');
        dialog = $('<div class="ee-dialog" role="dialog" aria-modal="true" aria-labelledby="eeTitle" tabindex="-1"></div>');
        titleEl = $('<div class="ee-title" id="eeTitle"></div>');
        closeBtn = $('<button type="button" class="ee-close" aria-label="Close">&times;</button>');
        nameInput = $('<input type="text" id="eeName" autocomplete="off" aria-label="Name">');
        textarea = $('<textarea class="ee-expression" id="eeExpression" spellcheck="false" aria-label="SQL expression"></textarea>');
        search = $('<input type="text" placeholder="Search columns..." autocomplete="off" aria-label="Search columns">');
        listEl = $('<div></div>');
        errorBox = $('<div class="ee-error" role="alert"></div>');
        cancelBtn = $('<button type="button" class="ee-btn quiet">Cancel</button>');
        submitBtn = $('<button type="button" class="ee-btn primary" title="Ctrl/Cmd+Enter"></button>');

        var nameField = $('<div class="ee-name-field"></div>')
            .append('<label class="ee-label" for="eeName">Name</label>').append(nameInput);
        var main = $('<div class="ee-main"></div>')
            .append('<label class="ee-label" for="eeExpression">SQL expression</label>').append(textarea);
        var columns = $('<div class="ee-columns"></div>')
            .append('<div class="ee-label" id="eeColumnsTitle">Columns</div>')
            .append($('<div class="ee-list" role="group" aria-labelledby="eeColumnsTitle"></div>')
                .append($('<div class="ee-search-row"></div>').append(search))
                .append('<div class="ee-list-head"><span>Name</span><span>Data type</span></div>')
                .append(listEl));
        dialog
            .append($('<div class="ee-header"></div>').append(titleEl).append(closeBtn))
            .append($('<div class="ee-body"></div>').append(nameField)
                .append($('<div class="ee-workspace"></div>').append(main).append(columns)))
            .append(errorBox)
            .append($('<div class="ee-footer"></div>').append(cancelBtn).append(submitBtn));
        overlay.append(dialog);
        $('body').append(overlay);

        closeBtn.on('click', close);
        cancelBtn.on('click', close);
        submitBtn.on('click', submit);
        nameInput.on('input', validate);
        textarea.on('input', validate);
        search.on('input', renderColumns);
        overlay.on('mousedown', function(e) { if (e.target === overlay[0]) { close(); } });

        // keep keystrokes away from the host page (e.g. DataTables key handling)
        overlay.on('keydown keyup keypress', function(e) {
            if (e.type === 'keydown') {
                if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
                    e.preventDefault();
                    submit();
                }
                if (e.key === 'Tab') {
                    var items = dialog.find('button, input, textarea').filter(':visible:not(:disabled)');
                    var first = items.first()[0], last = items.last()[0];
                    if (e.shiftKey && (document.activeElement === first || document.activeElement === dialog[0])) {
                        e.preventDefault();
                        last.focus();
                    } else if (!e.shiftKey && document.activeElement === last) {
                        e.preventDefault();
                        first.focus();
                    }
                }
            }
            e.stopPropagation();
        });
    }

    // window capture runs before any document-level Escape handler of the host dialog
    function onEscape(e) {
        if (e.key === 'Escape') {
            e.stopPropagation();
            close();
        }
    }

    function insertAtCursor(text) {
        var el = textarea[0];
        var start = el.selectionStart, end = el.selectionEnd;
        el.value = el.value.slice(0, start) + text + el.value.slice(end);
        el.selectionStart = el.selectionEnd = start + text.length;
        el.focus();
        validate();
    }

    function renderColumns() {
        var term = $.trim(search.val()).toLowerCase();
        listEl.empty();
        var shown = 0;
        opts.columns.forEach(function(col) {
            if (term && col.name.toLowerCase().indexOf(term) === -1) { return; }
            shown++;
            listEl.append($('<button type="button" class="ee-item"></button>')
                .attr('title', 'Insert ' + col.name)
                .append($('<span class="ee-name"></span>').text(col.name))
                .append($('<span class="ee-type"></span>').text(col.type || '').attr('title', col.type || ''))
                .on('click', function() { insertAtCursor(quoteIdent(col.name)); }));
        });
        if (!shown) { listEl.append($('<div class="ee-empty"></div>').text('No matching columns.')); }
    }

    function problem() {
        var name = $.trim(nameInput.val());
        if (!$.trim(textarea.val())) { return 'Enter an expression.'; }
        if (!name) { return 'Enter a name.'; }
        return opts.validateName ? opts.validateName(name) || '' : '';
    }

    function validate() {
        var error = problem();
        errorBox.text(error);
        submitBtn.prop('disabled', !!error);
    }

    function submit() {
        if (problem()) { return; }
        var result = { name: $.trim(nameInput.val()), expression: $.trim(textarea.val()) };
        close();
        opts.onSubmit(result);
    }

    function close() {
        if (!isOpen()) { return; }
        window.removeEventListener('keydown', onEscape, true);
        overlay.removeClass('show');
        if (lastFocus && lastFocus.focus) { lastFocus.focus(); }
    }

    function isOpen() {
        return !!overlay && overlay.hasClass('show');
    }

    // options: { title, columns: [{name, type}], name, expression, submitLabel, validateName(name) -> error, onSubmit({name, expression}) }
    function open(options) {
        if (!overlay) { build(); }
        opts = options;
        titleEl.text(opts.title || 'Expression editor');
        submitBtn.text(opts.submitLabel || 'OK');
        nameInput.val(opts.name || '');
        textarea.val(opts.expression || '');
        search.val('');
        renderColumns();
        validate();
        lastFocus = document.activeElement;
        window.addEventListener('keydown', onEscape, true);
        overlay.addClass('show');
        (opts.name ? textarea : nameInput).trigger('focus');
    }

    return { open: open, isOpen: isOpen };
})();
</script>
