<style>
    .ee-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(30, 41, 59, 0.45);
        z-index: 1600;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
    }
    .ee-overlay.show { display: flex; }
    .ee-dialog {
        display: flex;
        flex-direction: column;
        width: min(760px, calc(100vw - 24px));
        max-height: calc(100vh - 24px);
        background: white;
        border-radius: 8px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        font-size: 12px;
        color: #2c3e50;
        outline: none;
    }
    .ee-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #e5e7eb; }
    .ee-title { font-size: 14px; font-weight: bold; }
    .ee-close { border: none; background: none; font-size: 20px; line-height: 1; color: #6b7a8f; cursor: pointer; }
    .ee-close:hover { color: #2c3e50; }
    .ee-body { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; min-height: 0; overflow: auto; padding: 12px 14px; }
    .ee-label { display: block; margin: 0 0 4px 0; font-weight: bold; }
    .ee-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .ee-overlay input[type="text"] {
        width: 100%;
        height: 24px;
        padding: 0 6px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 12px;
        box-sizing: border-box;
    }
    .ee-expression {
        width: 100%;
        height: 240px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-family: Menlo, Consolas, monospace;
        font-size: 12px;
        resize: vertical;
    }
    .ee-overlay input[type="text"]:focus, .ee-expression:focus {
        outline: none;
        border-color: #5f7ea8;
        box-shadow: 0 0 0 2px rgba(95, 126, 168, 0.25);
    }
    .ee-columns { display: flex; flex-direction: column; min-width: 0; }
    .ee-list { height: 276px; overflow: auto; border: 1px solid #e5e7eb; border-radius: 4px; }
    .ee-search-row { position: sticky; top: 0; padding: 4px 6px; background: white; border-bottom: 1px solid #e5e7eb; }
    .ee-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 8px;
        border: none;
        border-bottom: 1px solid #f0f2f5;
        background: none;
        font-size: 12px;
        color: inherit;
        text-align: left;
        cursor: pointer;
    }
    .ee-item:hover { background: #eef2f9; }
    .ee-item:focus-visible { outline: none; box-shadow: inset 0 0 0 2px rgba(95, 126, 168, 0.35); }
    .ee-item .ee-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ee-item .ee-type { margin-left: auto; color: #8a97a8; white-space: nowrap; }
    .ee-empty { padding: 10px; color: #8a97a8; }
    .ee-footer { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid #e5e7eb; }
    .ee-error { flex: 1; color: #c0392b; }
    .ee-btn {
        height: 28px;
        padding: 0 14px;
        background: #f6f8fc;
        color: #5f7ea8;
        border: 1px solid #5f7ea8;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
    }
    .ee-btn:hover { background: #eef2f9; }
    .ee-btn.primary { background: #5f7ea8; color: white; }
    .ee-btn.primary:hover { background: #4f6d95; }
    .ee-btn.quiet { background: none; border-color: transparent; }
    .ee-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .ee-btn:focus-visible, .ee-close:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(95, 126, 168, 0.35); }
    @media (max-width: 760px) {
        .ee-body { grid-template-columns: 1fr; }
        .ee-list { height: 160px; }
    }
</style>
<script>
// Reusable SQL expression editor: type an expression, name it, click columns to insert them.
window.LionExpressionEditor = (function() {
    var overlay = null, dialog, titleEl, nameInput, textarea, search, listEl, errorBox, cancelBtn, submitBtn, closeBtn;
    var opts = null;
    var lastFocus = null;

    function quoteIdent(name) {
        return '`' + String(name).replace(/`/g, '``') + '`';
    }

    function build() {
        overlay = $('<div class="ee-overlay"></div>');
        dialog = $('<div class="ee-dialog" role="dialog" aria-modal="true" aria-labelledby="eeTitle" tabindex="-1"></div>');
        titleEl = $('<div class="ee-title" id="eeTitle"></div>');
        closeBtn = $('<button type="button" class="ee-close" aria-label="Close">&times;</button>');
        nameInput = $('<input type="text" autocomplete="off" aria-label="Name">');
        textarea = $('<textarea class="ee-expression" spellcheck="false" aria-label="SQL expression"></textarea>');
        search = $('<input type="text" placeholder="Search columns..." autocomplete="off" aria-label="Search columns">');
        listEl = $('<div></div>');
        errorBox = $('<div class="ee-error" role="alert"></div>');
        cancelBtn = $('<button type="button" class="ee-btn quiet">Cancel</button>');
        submitBtn = $('<button type="button" class="ee-btn primary" title="Ctrl/Cmd+Enter"></button>');

        var main = $('<div class="ee-main"></div>')
            .append($('<div></div>').append('<label class="ee-label">Name</label>').append(nameInput))
            .append($('<div></div>').append('<label class="ee-label">SQL expression</label>').append(textarea));
        var columns = $('<div class="ee-columns"></div>')
            .append('<label class="ee-label">Columns</label>')
            .append($('<div class="ee-list"></div>')
                .append($('<div class="ee-search-row"></div>').append(search))
                .append(listEl));
        dialog
            .append($('<div class="ee-header"></div>').append(titleEl).append(closeBtn))
            .append($('<div class="ee-body"></div>').append(main).append(columns))
            .append($('<div class="ee-footer"></div>').append(errorBox).append(cancelBtn).append(submitBtn));
        overlay.append(dialog);
        $('body').append(overlay);

        closeBtn.on('click', close);
        cancelBtn.on('click', close);
        submitBtn.on('click', submit);
        nameInput.on('input', validate);
        textarea.on('input', validate);
        search.on('input', renderColumns);
        overlay.on('mousedown', function(e) { if (e.target === overlay[0]) { close(); } });

        // keep keystrokes away from the host page (e.g. DataTables key handling)
        overlay.on('keydown keyup keypress', function(e) {
            if (e.type === 'keydown') {
                if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
                    e.preventDefault();
                    submit();
                }
                if (e.key === 'Tab') {
                    var items = dialog.find('button, input, textarea').filter(':visible:not(:disabled)');
                    var first = items.first()[0], last = items.last()[0];
                    if (e.shiftKey && (document.activeElement === first || document.activeElement === dialog[0])) {
                        e.preventDefault();
                        last.focus();
                    } else if (!e.shiftKey && document.activeElement === last) {
                        e.preventDefault();
                        first.focus();
                    }
                }
            }
            e.stopPropagation();
        });
    }

    // window capture runs before any document-level Escape handler of the host dialog
    function onEscape(e) {
        if (e.key === 'Escape') {
            e.stopPropagation();
            close();
        }
    }

    function insertAtCursor(text) {
        var el = textarea[0];
        var start = el.selectionStart, end = el.selectionEnd;
        el.value = el.value.slice(0, start) + text + el.value.slice(end);
        el.selectionStart = el.selectionEnd = start + text.length;
        el.focus();
        validate();
    }

    function renderColumns() {
        var term = $.trim(search.val()).toLowerCase();
        listEl.empty();
        var shown = 0;
        opts.columns.forEach(function(col) {
            if (term && col.name.toLowerCase().indexOf(term) === -1) { return; }
            shown++;
            listEl.append($('<button type="button" class="ee-item"></button>')
                .attr('title', 'Insert ' + col.name)
                .append($('<span class="ee-name"></span>').text(col.name))
                .append($('<span class="ee-type"></span>').text(col.type || ''))
                .on('click', function() { insertAtCursor(quoteIdent(col.name)); }));
        });
        if (!shown) { listEl.append($('<div class="ee-empty"></div>').text('No matching columns.')); }
    }

    function problem() {
        var name = $.trim(nameInput.val());
        if (!$.trim(textarea.val())) { return 'Enter an expression.'; }
        if (!name) { return 'Enter a name.'; }
        return opts.validateName ? opts.validateName(name) || '' : '';
    }

    function validate() {
        var error = problem();
        errorBox.text(error);
        submitBtn.prop('disabled', !!error);
    }

    function submit() {
        if (problem()) { return; }
        var result = { name: $.trim(nameInput.val()), expression: $.trim(textarea.val()) };
        close();
        opts.onSubmit(result);
    }

    function close() {
        if (!isOpen()) { return; }
        window.removeEventListener('keydown', onEscape, true);
        overlay.removeClass('show');
        if (lastFocus && lastFocus.focus) { lastFocus.focus(); }
    }

    function isOpen() {
        return !!overlay && overlay.hasClass('show');
    }

    // options: { title, columns: [{name, type}], name, expression, submitLabel, validateName(name) -> error, onSubmit({name, expression}) }
    function open(options) {
        if (!overlay) { build(); }
        opts = options;
        titleEl.text(opts.title || 'Expression editor');
        submitBtn.text(opts.submitLabel || 'OK');
        nameInput.val(opts.name || '');
        textarea.val(opts.expression || '');
        search.val('');
        renderColumns();
        validate();
        lastFocus = document.activeElement;
        window.addEventListener('keydown', onEscape, true);
        overlay.addClass('show');
        (opts.name ? textarea : nameInput).trigger('focus');
    }

    return { open: open, isOpen: isOpen };
})();
</script>
