<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="created" content="{generation_date}" />
<title>{html_title}</title>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.1/css/jquery.dataTables.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
    :root {
        --dt-text: #2c3e50;
        --dt-muted: #657487;
        --dt-border: #dce2e8;
        --dt-surface: #f6f8fa;
        --dt-accent: #5f7ea8;
        --dt-accent-hover: #4f6d95;
        --dt-hover: #eef2f9;
        --dt-focus: 0 0 0 2px rgba(95, 126, 168, 0.25);
    }
    body { 
        font-family: Arial, sans-serif; 
        margin: 15px;
        background: #f0f0f0;
    }

    /* support of multirow headers */
    table.dataTable thead tr:first-child:not(:last-child) th {
        border-bottom: none !important;
        text-align: center !important;
        padding-bottom: 2px !important;
    }
    table.dataTable thead tr:not(:first-child) th {
        padding-top: 2px !important;
    }
    /* room for the sort arrows so they don't touch right-aligned headers */
    table.dataTable thead th.sorting,
    table.dataTable thead th.sorting_asc,
    table.dataTable thead th.sorting_desc {
        padding-right: 30px;
    }
    #mainTable tbody tr:hover > td {
        box-shadow: inset 0 0 0 9999px rgba(95, 126, 168, 0.07);
    }
    .grouped_column {
        background-color: #f4f4f4;
    }

    /* Main table settings */
    #mainTable {
        width: 100%;
        background: white;
    }
    #mainTable td, th {
        padding: 5px 4px;
        font-size: 12px;
        white-space: nowrap;
    }
    #mainTable tr {
        height: 12px;
    }
    #mainTable td details {
        margin: 1px;
        display: inline-block;
        vertical-align: middle;
    }
    .dataTables_wrapper {
        padding: 16px;
        background: white;
        border-radius: 8px;
    }
    
    /* Toolbar buttons */
    #resetBtn, #columnBtn, #exportBtn, #queryBtn {
        height: 28px;
        padding: 0 12px;
        background: white;
        color: var(--dt-text);
        border: 1px solid var(--dt-border);
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        margin: 0;
        white-space: nowrap;
    }
    #resetBtn:hover, #columnBtn:hover, #exportBtn:hover, #queryBtn:hover {
        background: var(--dt-hover);
        border-color: var(--dt-accent);
    }
    #resetBtn {
        background: transparent;
        border-color: transparent;
        color: var(--dt-muted);
        margin-left: 4px;
    }
    #resetBtn:hover {
        border-color: transparent;
    }
    .export-wrapper, .column-wrapper {
        position: relative;
        display: inline-block;
    }
    #exportMenu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        margin-top: 5px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        z-index: 1000;
        min-width: 110px;
        padding: 4px 0;
    }
    #exportMenu.show {
        display: block;
    }
    .export-item {
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        user-select: none;
    }
    .export-item:hover {
        background: #f0f4fa;
    }
    #exportToast {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        background: #2c3e50;
        color: white;
        padding: 8px 14px;
        border-radius: 4px;
        font-size: 12px;
        z-index: 2000;
        display: none;
    }
    #columnList {
        display: none;
        position: fixed;
        flex-direction: column;
        box-sizing: border-box;
        width: min(380px, calc(100vw - 16px));
        max-height: min(520px, calc(100vh - 16px));
        overflow: auto;
        background: white;
        color: var(--dt-text);
        border: 1px solid var(--dt-border);
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(30, 41, 59, 0.16);
        z-index: 1000;
    }
    #columnList.show {
        display: flex;
    }
    .column-search-container {
        flex: none;
        padding: 12px 12px 8px;
    }
    #columnSearch {
        width: 100%;
        height: 28px;
        box-sizing: border-box;
        font-size: 12px;
        padding: 4px 8px;
        border: 1px solid var(--dt-border);
        border-radius: 4px;
    }
    .column-item.hidden {
        display: none;
    }
    .column-items-container {
        flex: 0 1 auto;
        min-height: 0;
        max-height: 288px;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
        padding: 4px 8px;
    }
    .column-list-head {
        display: flex;
        justify-content: space-between;
        flex: none;
        padding: 6px 16px;
        border-top: 1px solid var(--dt-border);
        border-bottom: 1px solid var(--dt-border);
        background: var(--dt-surface);
        color: var(--dt-muted);
        font-size: 11px;
    }
    .column-item {
        min-height: 28px;
        padding: 5px 8px;
        font-size: 12px;
        cursor: pointer;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, auto);
        gap: 12px;
        align-items: center;
        user-select: none;
        border-radius: 3px;
    }
    .column-name {
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .column-type {
        text-align: right;
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--dt-muted);
        font-size: 11px;
    }
    .column-item.selected .column-type {
        color: #6b86ad;
    }
    .column-item:hover {
        background: #f0f4fa;
    }
    .column-item.selected {
        background: #dce6f4;
        color: #2f4a70;
    }
    .column-item.selected:hover {
        background: #cfdcf0;
    }
    .buttons-container {
        flex: none;
        padding: 12px;
        border-top: 1px solid var(--dt-border);
        background: var(--dt-surface);
    }
    .selection-row {
        display: flex;
        flex: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        padding: 0 8px 8px;
    }
    .select-btn {
        padding: 2px 6px;
        background: none;
        color: #5f7ea8;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
    }
    .select-btn:hover {
        background: #e8eef8;
        color: #2f4a70;
    }
    .selection-count {
        margin-left: auto;
        color: var(--dt-muted);
        font-size: 11px;
        white-space: nowrap;
    }
    .column-action-row {
        display: flex;
        align-items: flex-end;
        gap: 12px;
    }
    .column-copy-actions {
        flex: 1;
        min-width: 0;
    }
    .column-copy-label {
        display: block;
        margin-bottom: 4px;
        color: var(--dt-muted);
        font-size: 11px;
    }
    .apply-btn {
        flex: none;
        height: 28px;
        padding: 0 12px;
        background: var(--dt-accent);
        color: white;
        border: 1px solid var(--dt-accent);
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
    }
    .apply-btn:hover {
        background: var(--dt-accent-hover);
    }
    .apply-btn:active {
        background: #405c82;
    }
    .copy-group {
        display: flex;
    }
    .copy-btn {
        flex: 1;
        min-width: 0;
        height: 28px;
        padding: 0 4px;
        margin-left: -1px;
        background: white;
        color: var(--dt-text);
        border: 1px solid var(--dt-border);
        border-radius: 0;
        cursor: pointer;
        font-size: 12px;
        text-align: center;
        white-space: nowrap;
    }
    .copy-btn:first-child {
        margin-left: 0;
        border-radius: 4px 0 0 4px;
    }
    .copy-btn:last-child {
        border-radius: 0 4px 4px 0;
    }
    .copy-btn:hover {
        background: #eef2f9;
        position: relative;
    }
    .copy-btn:active {
        background: #e3eaf5;
    }
    .dt-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px 16px;
        padding-bottom: 12px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--dt-border);
    }
    .dt-toolbar-left, .dt-toolbar-right, .dt-footer, .dt-footer-navigation {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        min-width: 0;
    }
    .dt-toolbar-right {
        margin-left: auto;
    }
    .dt-footer {
        justify-content: space-between;
        gap: 12px 16px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--dt-border);
        color: var(--dt-muted);
    }
    .dt-footer-navigation {
        justify-content: flex-end;
        gap: 8px 16px;
        margin-left: auto;
    }
    .dataTables_wrapper .dt-footer .dataTables_length,
    .dataTables_wrapper .dt-footer .dataTables_info,
    .dataTables_wrapper .dt-footer .dataTables_paginate,
    .dataTables_wrapper .dt-toolbar .dataTables_filter {
        float: none;
        clear: none;
        margin: 0;
        padding: 0;
    }
    .dt-footer .dataTables_length label,
    .dt-toolbar .dataTables_filter label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        font-size: 12px;
    }
    .dt-toolbar select,
    .dt-footer select,
    .dt-toolbar .dataTables_filter input {
        box-sizing: border-box;
        height: 28px;
        margin: 0;
        padding: 0 8px;
        font-size: 12px;
        border: 1px solid var(--dt-border);
        border-radius: 4px;
        background-color: white;
    }
    #valueFilter {
        max-width: min(260px, 100%);
    }
    .dt-toolbar .dataTables_filter {
        min-width: 0;
        max-width: 100%;
    }
    .dt-toolbar .dataTables_filter input {
        width: 180px;
        min-width: 0;
    }
    .dt-toolbar select:focus,
    .dt-footer select:focus,
    .dt-toolbar .dataTables_filter input:focus,
    #columnSearch:focus {
        outline: none;
        border-color: var(--dt-accent);
        box-shadow: var(--dt-focus);
    }
    #resetBtn:focus-visible, #columnBtn:focus-visible, #exportBtn:focus-visible, #queryBtn:focus-visible,
    .select-btn:focus-visible, .copy-btn:focus-visible, .apply-btn:focus-visible {
        position: relative;
        outline: none;
        box-shadow: var(--dt-focus);
    }

    .dataTables_wrapper .dataTables_info,
    .dataTables_wrapper .dataTables_paginate {
        font-size: 12px;
    }
    @media (max-width: 600px) {
        body { margin: 8px; }
        .dataTables_wrapper { padding: 12px; }
        .dt-toolbar-right { width: 100%; margin-left: 0; }
        .dt-footer-navigation { justify-content: flex-start; margin-left: 0; }
    }
    @media (max-width: 400px) {
        .column-action-row { flex-direction: column; align-items: stretch; }
    }
</style>
</head>
<body>

<div style="max-width: {max_width};">
    {main_table}
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.min.js"></script>
{expression_editor_assets}
{query_builder_assets}
<script>
$(document).ready(function() {
    var filterEnabled = {column_filter};
    var FILTER_BACK = '__back__';
    var FILTER_MODE_ALL = '__all__';
    var FILTER_MODE_EMPTY = '__empty__';
    var FILTER_MODE_NON_EMPTY = '__non_empty__';
    var filterColumnIndex = -1;
    var filterMode = FILTER_MODE_ALL;
    var filterValue = '';

    var table = $('#mainTable').DataTable({
        paging: true,
        searching: true,
        info: true,
        pageLength: {page_length},
        lengthMenu: {length_menu},
        scrollX: true,
        select: true,
        keys: true,
        {other_options},
        columnDefs: [
            {col_defs}
        ],
    });
    
    // Capture original state for the reset button
    // JSON parse/stringify creates a clean copy of the ordering array
    var initialOrder = table.order() ? JSON.parse(JSON.stringify(table.order())) : [];
    var initialLength = table.page.len();

    if (filterEnabled) {
        $.fn.dataTable.ext.search.push(function(settings, data, dataIndex) {
            if (settings.nTable !== table.table().node()) {
                return true;
            }
            if (filterMode === FILTER_MODE_ALL || filterColumnIndex < 0) {
                return true;
            }

            var cellNode = table.cell(dataIndex, filterColumnIndex).node();
            if (!cellNode) {
                return true;
            }

            var rowCellText = $(cellNode)
                .text()
                .replace(/\u00a0/g, ' ')
                .trim();

            if (filterMode === FILTER_MODE_EMPTY) {
                return rowCellText === '';
            }

            if (filterMode === FILTER_MODE_NON_EMPTY) {
                return rowCellText !== '';
            }

            return rowCellText === filterValue;
        });
    }

    // Add Reset and Column buttons
    var resetBtn = $('<button id="resetBtn">Reset</button>');
    var columnBtn = $('<button id="columnBtn">Columns</button>');
    var columnList = $('<div id="columnList"></div>');
    var exportBtn = $('<button id="exportBtn">Export</button>');
    var exportMenu = $('<div id="exportMenu"></div>');
    exportMenu.append('<div class="export-item" data-export="excel">Excel</div>');
    exportMenu.append('<div class="export-item" data-export="markdown">Markdown</div>');
    var exportWrapper = $('<span class="export-wrapper"></span>').append(exportBtn).append(exportMenu);
    var exportToast = $('<div id="exportToast"></div>');
    $('body').append(exportToast);
    var queryBtn = $('<button id="queryBtn">Query</button>');
    var filterSelect = null;
    
    var selectButtonsDiv = $('<div class="select-buttons"></div>');
    var selectAllBtn = $('<button class="select-btn">Select All</button>');
    var deselectAllBtn = $('<button class="select-btn">Deselect All</button>');
    selectButtonsDiv.append(selectAllBtn);
    selectButtonsDiv.append(deselectAllBtn);
    
    var columnItemsContainer = $('<div class="column-items-container"></div>');
    
    var options = {columns};
    options.forEach(function(option) {
        var columnName = option.split('---')[0];
        var columnType = option.split('---')[1].slice(1, -1);
        
        var item = $('<div class="column-item" data-column="' + option + '" data-column-name="' + columnName + '">' +
            '<span class="column-name">' + columnName + '</span>' +
            '<span class="column-type">' + columnType + '</span>' +
            '</div>');
        item.find('.column-name').attr('title', columnName);
        item.find('.column-type').attr('title', columnType);
        columnItemsContainer.append(item);
    });
    
    var buttonsContainer = $('<div class="buttons-container"></div>');
    
    var selectButtonsRow = $('<div class="selection-row"></div>');
    var selectAllBtn = $('<button class="select-btn">Select all</button>');
    var deselectAllBtn = $('<button class="select-btn">Deselect all</button>');
    var selectionCount = $('<span class="selection-count"></span>');
    selectButtonsRow.append(selectAllBtn);
    selectButtonsRow.append(deselectAllBtn);
    selectButtonsRow.append(selectionCount);
    
    var applyBtn = $('<button class="apply-btn" title="Show only the selected columns">Apply</button>');
    var copyButtonsRow = $('<div class="copy-group" role="group" aria-label="Copy column names"></div>');
    var copyBtn1 = $('<button class="copy-btn" data-format="simple" title="Copy names: a, b, c">Plain</button>');
    var copyBtn2 = $('<button class="copy-btn" data-format="quoted" title="Copy names: &quot;a&quot;, &quot;b&quot;, &quot;c&quot;">Quoted</button>');
    var copyBtn3 = $('<button class="copy-btn" data-format="quoted-newline" title="Copy names: one quoted name per line">Lines</button>');
    copyButtonsRow.append(copyBtn1);
    copyButtonsRow.append(copyBtn2);
    copyButtonsRow.append(copyBtn3);
    
    function updateSelectionCount() {
        var items = columnItemsContainer.find('.column-item');
        selectionCount.text(items.filter('.selected').length + ' of ' + items.length + ' selected');
    }
    updateSelectionCount();
    
    var copyActions = $('<div class="column-copy-actions"></div>')
        .append('<span class="column-copy-label">Copy names</span>')
        .append(copyButtonsRow);
    buttonsContainer.append($('<div class="column-action-row"></div>').append(copyActions).append(applyBtn));
    
    var columnSearchContainer = $('<div class="column-search-container"></div>');
    var columnSearch = $('<input type="text" id="columnSearch" placeholder="Search columns..." autocomplete="off" aria-label="Search columns">');
    columnSearchContainer.append(columnSearch);

    columnList.append(columnSearchContainer);
    columnList.append(selectButtonsRow);
    columnList.append('<div class="column-list-head"><span>Name</span><span>Data type</span></div>');
    columnList.append(columnItemsContainer);
    columnList.append(buttonsContainer);
    
    // Insert Column first and then Reset so Reset sits between Columns and Search.

    if (filterEnabled) {
        filterSelect = $('<select id="valueFilter"></select>');

        var getCellText = function(rowIdx, colIdx) {
            var cellNode = table.cell(rowIdx, colIdx).node();
            if (!cellNode) {
                return '';
            }
            return $(cellNode)
                .text()
                .replace(/\u00a0/g, ' ')
                .trim();
        };

        var showColumnOptions = function() {
            filterColumnIndex = -1;
            filterMode = FILTER_MODE_ALL;
            filterValue = '';
            filterSelect.empty();
            filterSelect.append($('<option></option>').val(FILTER_MODE_ALL).text('Filter column...'));
            table.columns().every(function(colIdx) {
                if (!this.visible()) {
                    return;
                }
                var label = $(this.header()).text().trim();
                filterSelect.append($('<option></option>').val('c:' + colIdx).text(label));
            });
            filterSelect.val(FILTER_MODE_ALL);
        };

        var showValueOptions = function(colIdx, colLabel) {
            filterColumnIndex = colIdx;
            filterMode = FILTER_MODE_ALL;
            filterValue = '';

            var distinctValues = new Set();
            var hasEmptyValue = false;

            table.rows({ search: 'none' }).every(function(rowIdx) {
                var textValue = getCellText(rowIdx, colIdx);
                if (textValue === '') {
                    hasEmptyValue = true;
                    return;
                }
                distinctValues.add(textValue);
            });

            filterSelect.empty();
            filterSelect.append($('<option></option>').val(FILTER_BACK).text('<- Columns'));
            filterSelect.append($('<option></option>').val(FILTER_MODE_ALL).text(colLabel + ': (all)'));
            filterSelect.append($('<option></option>').val(FILTER_MODE_NON_EMPTY).text(colLabel + ': (non-empty)'));
            if (hasEmptyValue) {
                filterSelect.append($('<option></option>').val(FILTER_MODE_EMPTY).text(colLabel + ': (empty)'));
            }

            Array.from(distinctValues)
                .sort(function(a, b) {
                    return a.localeCompare(b);
                })
                .forEach(function(value) {
                    filterSelect.append($('<option></option>').val('v:' + value).text(value));
                });

            filterSelect.val(FILTER_MODE_ALL);
        };

        filterSelect.on('change', function() {
            var selectedValue = $(this).val();

            if (selectedValue.indexOf('c:') === 0) {
                var selectedOption = $(this).find('option:selected');
                showValueOptions(parseInt(selectedValue.slice(2), 10), selectedOption.text());
                table.draw();
                return;
            }

            if (selectedValue === FILTER_BACK) {
                showColumnOptions();
            } else if (selectedValue === FILTER_MODE_ALL) {
                filterMode = FILTER_MODE_ALL;
                filterValue = '';
            } else if (selectedValue === FILTER_MODE_NON_EMPTY) {
                filterMode = FILTER_MODE_NON_EMPTY;
                filterValue = '';
            } else if (selectedValue === FILTER_MODE_EMPTY) {
                filterMode = FILTER_MODE_EMPTY;
                filterValue = '';
            } else if (selectedValue.indexOf('v:') === 0) {
                filterMode = 'value';
                filterValue = selectedValue.slice(2);
            }

            table.draw();
        });

        showColumnOptions();
    }

    var wrapper = $(table.table().container());
    var columnWrapper = $('<span class="column-wrapper"></span>').append(columnBtn).append(columnList);
    var toolbarLeft = $('<div class="dt-toolbar-left"></div>')
        .append(columnWrapper)
        .append(exportWrapper)
        .append(queryBtn)
        .append(resetBtn);
    var toolbarRight = $('<div class="dt-toolbar-right"></div>');
    if (filterEnabled && filterSelect) {
        toolbarRight.append(filterSelect);
    }
    toolbarRight.append(wrapper.find('.dataTables_filter'));
    $('<div class="dt-toolbar"></div>').append(toolbarLeft).append(toolbarRight).prependTo(wrapper);
    var footerNavigation = $('<div class="dt-footer-navigation"></div>')
        .append(wrapper.find('.dataTables_length'))
        .append(wrapper.find('.dataTables_paginate'));
    $('<div class="dt-footer"></div>')
        .append(wrapper.find('.dataTables_info'))
        .append(footerNavigation)
        .appendTo(wrapper);
    
    // Reset button logic
    resetBtn.on('click', function(e) {
        e.preventDefault();
        table.search('');              // Clear search filter
        options.forEach(function(option, idx) {
            table.column(idx).visible(true, false);
        });
        $(table.table().node()).css('width', '100%');
        table.columns.adjust();
        if (filterEnabled && filterSelect) {
            filterColumnIndex = -1;
            filterMode = FILTER_MODE_ALL;
            filterValue = '';
            filterSelect.empty();
            filterSelect.append($('<option></option>').val(FILTER_MODE_ALL).text('Filter column...'));
            table.columns().every(function(colIdx) {
                if (!this.visible()) {
                    return;
                }
                var label = $(this.header()).text().trim();
                filterSelect.append($('<option></option>').val('c:' + colIdx).text(label));
            });
            filterSelect.val(FILTER_MODE_ALL);
        }
        table.order(initialOrder);     // Reset to original column sort
        table.page.len(initialLength); // Reset to original page length
        table.draw();                  // Redraw the table to apply changes
    });

    function positionColumnList() {
        if (!columnList.hasClass('show')) { return; }
        var anchor = columnBtn[0].getBoundingClientRect();
        var viewport = document.documentElement;
        var gap = 8;
        var below = Math.max(0, viewport.clientHeight - anchor.bottom - gap * 2);
        var above = Math.max(0, anchor.top - gap * 2);
        var openAbove = below < 300 && above > below;
        columnList.css({ maxHeight: Math.min(520, openAbove ? above : below) + 'px' });
        var bounds = columnList[0].getBoundingClientRect();
        columnList.css({
            left: Math.max(gap, Math.min(anchor.left, viewport.clientWidth - bounds.width - gap)) + 'px',
            top: Math.max(gap, Math.min(openAbove ? anchor.top - gap - bounds.height : anchor.bottom + gap,
                viewport.clientHeight - bounds.height - gap)) + 'px'
        });
    }

    $(window).on('resize', positionColumnList);
    document.addEventListener('scroll', function(event) {
        if (!columnList[0].contains(event.target)) { positionColumnList(); }
    }, true);

    // Toggle column list on button click
    columnBtn.on('click', function(e) {
        e.stopPropagation();
        exportMenu.removeClass('show');
        columnList.toggleClass('show');
        if (columnList.hasClass('show')) {
            positionColumnList();
            columnSearch.trigger('focus');
        }
    });

    columnSearch.on('click', function(e) {
        e.stopPropagation();
    });

    // Keep keystrokes from reaching DataTables key handling
    columnSearch.on('keydown keyup keypress', function(e) {
        e.stopPropagation();
    });

    columnSearch.on('input', function() {
        var term = $(this).val().toLowerCase();
        columnItemsContainer.find('.column-item').each(function() {
            var name = String($(this).data('column-name')).toLowerCase();
            $(this).toggleClass('hidden', name.indexOf(term) === -1);
        });
    });
    
    columnList.on('click', '.column-item', function(e) {
        e.stopPropagation();
        $(this).toggleClass('selected');
        updateSelectionCount();
    });
    
    selectAllBtn.on('click', function(e) {
        e.stopPropagation();
        $('.column-item:not(.hidden)').addClass('selected');
        updateSelectionCount();
    });
    
    deselectAllBtn.on('click', function(e) {
        e.stopPropagation();
        $('.column-item:not(.hidden)').removeClass('selected');
        updateSelectionCount();
    });
    
    function copyToClipboard(format, button) {
        var selectedColumns = [];
        $('#columnList .column-item.selected').each(function() {
            selectedColumns.push($(this).data('column-name'));
        });
        
        if (selectedColumns.length > 0) {
            var columnString;
            
            if (format === 'simple') {
                columnString = selectedColumns.join(', ');
            } else if (format === 'quoted') {
                columnString = selectedColumns.map(function(col) {
                    return '"' + col + '"';
                }).join(', ');
            } else if (format === 'quoted-newline') {
                columnString = selectedColumns.map(function(col) {
                    return '"' + col + '"';
                }).join(',\n') + ',';
            }
            
            var textarea = $('<textarea>');
            textarea.val(columnString);
            textarea.css({
                position: 'fixed',
                top: 0,
                left: 0,
                width: '2em',
                height: '2em',
                padding: 0,
                border: 'none',
                outline: 'none',
                boxShadow: 'none',
                background: 'transparent'
            });
            $('body').append(textarea);
            textarea[0].select();
            
            try {
                var successful = document.execCommand('copy');
                if (successful) {
                    // keep the label in data so a second click during the 1.5s window can't capture 'Copied!' as the label
                    if (button.data('label') === undefined) {
                        button.data('label', button.html());
                    }
                    clearTimeout(button.data('timer'));
                    button.html('✓ Copied!');
                    button.data('timer', setTimeout(function() {
                        button.html(button.data('label'));
                    }, 1500));
                } else {
                    alert('Copy failed. Text: ' + columnString);
                }
            } catch (err) {
                alert('Copy failed. Text: ' + columnString);
            }
            
            textarea.remove();
        } else {
            alert('No columns selected');
        }
    }
    
    columnList.on('click', '.copy-btn', function(e) {
        e.stopPropagation();
        var format = $(this).data('format');
        copyToClipboard(format, $(this));
    });

    columnList.on('click', '.apply-btn', function(e) {
        e.stopPropagation();
        // item order equals DataTables column order; the hidden rownum column is not in the list
        var selected = columnItemsContainer.find('.column-item').map(function() {
            return $(this).hasClass('selected');
        }).get();

        if (selected.indexOf(true) === -1) {
            alert('No columns selected');
            return;
        }

        selected.forEach(function(isSelected, idx) {
            table.column(idx).visible(isSelected, false);
        });
        // a column subset is sized to its content instead of stretched over the full width
        $(table.table().node()).css({ width: selected.every(Boolean) ? '100%' : 'auto', marginLeft: 0 });
        table.columns.adjust().draw(false);

        if (filterEnabled && filterSelect && filterColumnIndex >= 0 && !table.column(filterColumnIndex).visible()) {
            showColumnOptions();
            table.draw(false);
        }

        columnList.removeClass('show');
    });
    
    $(document).on('click', function(e) {
        if (!$(e.target).closest('#columnBtn, #columnList').length) {
            columnList.removeClass('show');
        }
        if (!$(e.target).closest('#exportBtn, #exportMenu').length) {
            exportMenu.removeClass('show');
        }
    });

    function showToast(message) {
        exportToast.text(message).stop(true, true).fadeIn(150).delay(2000).fadeOut(300);
    }

    LionQueryBuilder.init({
        table: table,
        meta: {query_builder_meta},
        button: queryBtn,
        showToast: showToast,
        getFilter: function() {
            return { colIdx: filterColumnIndex, mode: filterMode, value: filterValue };
        },
        getSort: function() {
            return table.order();
        }
    });

    function cellToText(raw) {
        if (raw === null || raw === undefined) {
            return '';
        }
        var body = new DOMParser()
            .parseFromString(String(raw).replace(/<br\s*\/?>/gi, '\n'), 'text/html')
            .body;
        // the summary is only a truncated preview of the expandable content
        $(body).find('summary').remove();
        return $(body).text().replace(/\u00a0/g, ' ').trim();
    }

    function getExportHeaders(colIdxs) {
        var levels = [];
        $(table.table().header()).find('tr').each(function() {
            var cells = [];
            $(this).children('th').each(function() {
                var span = parseInt($(this).attr('colspan') || '1', 10);
                var text = $(this).text().replace(/\u00a0/g, ' ').trim();
                for (var s = 0; s < span; s++) {
                    cells.push(text);
                }
            });
            levels.push(cells);
        });

        var totalCols = table.columns().indexes().length;
        var usable = levels.filter(function(cells) {
            return cells.length === totalCols || cells.length === colIdxs.length;
        });

        return colIdxs.map(function(colIdx, k) {
            var parts = usable.map(function(cells) {
                return cells.length === totalCols ? cells[colIdx] : cells[k];
            });
            if (parts.length === 0) {
                parts = [$(table.column(colIdx).header()).text().replace(/\u00a0/g, ' ').trim()];
            }
            return parts.filter(function(part, i) {
                return part !== '' && (i === 0 || part !== parts[i - 1]);
            }).join(' ');
        });
    }

    function getExportData() {
        var colIdxs = table.columns().indexes().toArray().filter(function(colIdx) {
            return table.column(colIdx).visible();
        });
        var numeric = colIdxs.map(function(colIdx) {
            return $(table.column(colIdx).header()).hasClass('dt-right');
        });
        var rows = table.rows({ search: 'applied', order: 'applied' }).data().toArray().map(function(row) {
            return colIdxs.map(function(colIdx, k) {
                var text = cellToText(row[colIdx]);
                if (numeric[k] && /^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(text)) {
                    return Number(text);
                }
                return text;
            });
        });
        return { headers: getExportHeaders(colIdxs), numeric: numeric, rows: rows };
    }

    function copyText(text) {
        var textarea = $('<textarea>');
        textarea.val(text);
        textarea.css({ position: 'fixed', top: 0, left: 0, width: '2em', height: '2em', opacity: 0 });
        $('body').append(textarea);
        textarea[0].select();
        var successful = false;
        try {
            successful = document.execCommand('copy');
        } catch (err) {
            successful = false;
        }
        textarea.remove();
        return successful;
    }

    function exportToExcel() {
        // loaded on first use so it can't delay or break the table setup
        if (typeof XLSX !== 'undefined') {
            writeExcel();
            return;
        }
        showToast('Preparing Excel export...');
        $.ajax({
            url: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
            dataType: 'script',
            cache: true
        }).done(writeExcel).fail(function() {
            alert('Excel export library could not be loaded.');
        });
    }

    function writeExcel() {
        var data = getExportData();
        var sheet = XLSX.utils.aoa_to_sheet([data.headers].concat(data.rows));
        var book = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(book, sheet, 'Data');
        var fileName = (document.title || 'dataframe').replace(/[^\w\- ]+/g, '_').trim() || 'dataframe';
        var base64 = XLSX.write(book, { bookType: 'xlsx', type: 'base64' });
        // a data URI anchor is what the notebook download button uses; blob downloads get no save dialog there
        // start the download from the parent document when same-origin, like the notebook download button does
        var host = document;
        try {
            if (window.parent !== window && window.parent.document) {
                host = window.parent.document;
            }
        } catch (err) {
            host = document;
        }
        var link = host.createElement('a');
        link.href = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,' + base64;
        link.download = fileName + '.xlsx';
        host.body.appendChild(link);
        link.click();
        host.body.removeChild(link);
    }

    function exportToMarkdown() {
        var data = getExportData();
        var escapeCell = function(value) {
            return String(value).replace(/\|/g, '\\|').replace(/\r?\n/g, '<br>');
        };
        var lines = [
            '| ' + data.headers.map(escapeCell).join(' | ') + ' |',
            '| ' + data.numeric.map(function(isNumeric) { return isNumeric ? '---:' : '---'; }).join(' | ') + ' |'
        ];
        data.rows.forEach(function(row) {
            lines.push('| ' + row.map(escapeCell).join(' | ') + ' |');
        });
        var markdown = lines.join('\n');
        if (copyText(markdown)) {
            showToast('Markdown table copied to memory');
        } else {
            alert('Copy failed.');
        }
    }

    exportBtn.on('click', function(e) {
        e.stopPropagation();
        columnList.removeClass('show');
        exportMenu.toggleClass('show');
    });

    queryBtn.on('click', function() {
        columnList.removeClass('show');
        exportMenu.removeClass('show');
    });

    exportMenu.on('click', '.export-item', function(e) {
        e.stopPropagation();
        exportMenu.removeClass('show');
        if ($(this).data('export') === 'excel') {
            exportToExcel();
        } else {
            exportToMarkdown();
        }
    });

    // VS Code notebook output nests this content in an extra iframe that swallows the
    // native Cmd/Ctrl-C shortcut, so re-implement it via execCommand on the current selection.
    $(document).on('keydown', function(e) {
        var isCopyShortcut = (e.metaKey || e.ctrlKey) && (e.key === 'c' || e.key === 'C');
        if (!isCopyShortcut) {
            return;
        }
        var selection = window.getSelection().toString();
        if (!selection) {
            return;
        }
        e.preventDefault();
        try {
            document.execCommand('copy');
        } catch (err) {
            // ignore, nothing we can do if execCommand is unavailable
        }
    });
});
</script>
